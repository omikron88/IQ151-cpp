name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        static: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev xvfb xauth
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DIQ151_STATIC=${{ matrix.static }}
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - run: xvfb-run -a env SDL_AUDIODRIVER=dummy ./build/iq151 --window-smoke
      - if: matrix.static == 'ON'
        run: cmake --install build --prefix package
      - if: matrix.static == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: iq151-linux-x86_64
          path: package/
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        static: ["OFF", "ON"]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DIQ151_STATIC=${{ matrix.static }}
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - if: matrix.static == 'ON'
        run: cmake --install build --prefix package
      - if: matrix.static == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: iq151-windows-x86_64
          path: package/
